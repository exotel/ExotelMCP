# Release the Exotel CLI: single-file binaries for 5 platforms, a GitHub release, the Homebrew formula,
# and (optional) npm with provenance.
# Trigger: push a tag cli-v<version> matching cli/package.json, e.g.  git tag cli-v0.1.6 && git push origin cli-v0.1.6
# Optional secrets:
#   HOMEBREW_TAP_TOKEN  token with write access to exotel/homebrew-tap → the formula is pushed there
#   NPM_TOKEN           npm automation token → `npm publish --provenance` (otherwise publish by hand)
name: cli-release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-13, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'   # --build-sea needs Node >= 25.5
      - name: Tag matches package.json
        shell: bash
        run: test "cli-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: node scripts/build-binary.js
      - uses: actions/upload-artifact@v4
        with:
          name: exotel-${{ matrix.target }}
          path: |
            cli/dist/exotel-*.tar.gz
            cli/dist/exotel-*.tar.gz.sha256
            cli/dist/exotel-*.zip
            cli/dist/exotel-*.zip.sha256

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Homebrew formula
        run: node cli/scripts/homebrew-formula.js artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Exotel CLI ${GITHUB_REF_NAME#cli-v}" \
            --notes "Install: \`brew install exotel/tap/exotel\`, \`npm install -g exotel-cli\`, or download the binary for your platform below (no Node.js needed). Checksums: *.sha256."
      - name: Push formula to exotel/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/exotel/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp artifacts/exotel.rb tap/Formula/exotel.rb
          cd tap
          git config user.name "exotel-cli release" && git config user.email "noreply@exotel.com"
          git add Formula/exotel.rb && git commit -m "exotel ${GITHUB_REF_NAME#cli-v}" && git push

  npm:
    needs: binaries
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm publish --provenance
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: cli
        run: npm publish --provenance --access public
