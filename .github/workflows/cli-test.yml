# Exotel CLI: tests on every PR and push that touches the CLI or the skills.
name: cli-test

on:
  pull_request:
    paths: ['cli/**', 'skills/**', '.github/workflows/cli-*.yml']
  push:
    branches: [main]
    paths: ['cli/**', 'skills/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        node: ['18', '22', '26']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package contents (skills bundled, no secrets)
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          test "$(grep -c 'SKILL.md' pack.txt)" -ge 16
  binary:
    runs-on: macos-14
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node scripts/build-binary.js
