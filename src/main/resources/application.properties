spring.application.name=mcp_api

# Server
server.port=${PORT:8080}
spring.main.web-application-type=servlet

# HTTP Buffer Configuration
server.tomcat.max-http-response-header-size=65536
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HTTP connection and timeout settings
server.tomcat.connection-timeout=30000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Spring Web
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# Database (H2 for callback tracking)
spring.datasource.url=jdbc:h2:file:./data/exotel_callbacks
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD}
spring.h2.console.enabled=false

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Exotel CPaaS callback URL (your public-facing URL for webhooks)
exotel.base.url=${EXOTEL_CALLBACK_URL:http://localhost:8080}

# VoiceBot defaults (overridden by Authorization header in production)
exotel.voicebot.api.key=${VOICEBOT_API_KEY:}
exotel.voicebot.api.token=${VOICEBOT_API_TOKEN:}
exotel.voicebot.account.id=${VOICEBOT_ACCOUNT_ID:}
exotel.voicebot.base.url=${VOICEBOT_BASE_URL:https://voicebot.in.exotel.com/voicebot/api/v2}
# Tools Extension stamp base URL (ending /voicebot). Empty = callers must send te_base_url in the envelope.
exotel.voicebot.te.base.url=${TE_BASE_URL:}
exotel.voicebot.calls.base.url=${CALLS_BASE_URL:https://api.in.exotel.com}
exotel.voicebot.ssl.verify=${SSL_VERIFY:true}
exotel.voicebot.calls.force.http=${CALLS_FORCE_HTTP:false}

# Calls API defaults (overridden by Authorization header)
exotel.calls.account.sid=${CALLS_ACCOUNT_SID:}
exotel.calls.api.key=${CALLS_API_KEY:}
exotel.calls.api.token=${CALLS_API_TOKEN:}

# Engage API (SMS message campaigns; credentials reuse calls_* / CPaaS)
exotel.engage.base.url=${ENGAGE_BASE_URL:https://engage.exotel.com}

# Login credential check (host used for core credentials when api_domain is absent; allowed: api.exotel.com, api.in.exotel.com)
exotel.auth.verify.api.domain=${AUTH_VERIFY_API_DOMAIN:https://api.exotel.com}

# Login credential check, known API bases (scheme + host + base path, comma-separated) for VoiceBot, Admin, Tools Server
# and AI Assist. A caller-supplied base URL must equal one of these (host case and trailing slash ignored); the login
# probe is only ever sent to these. Defaults: the service base URLs above (Admin: the VoiceBot bases at /api/v1).
exotel.auth.verify.voicebot.api.bases=${VERIFY_VOICEBOT_API_BASES:${exotel.voicebot.base.url}}
exotel.auth.verify.admin.api.bases=${VERIFY_ADMIN_API_BASES:}
exotel.auth.verify.tools.server.api.bases=${VERIFY_TOOLS_SERVER_API_BASES:${exotel.tools.server.base.url}}
exotel.auth.verify.ai.assist.api.bases=${VERIFY_AI_ASSIST_API_BASES:https://ai-assist.in.exotel.com/ai-assist/api}

# Default caller ID
exotel.voicebot.default.caller.id=${DEFAULT_CALLER_ID:}

# Session cookies (optional, for dev only)
exotel.voicebot.session.cookie=${VOICEBOT_SESSION_COOKIE:}
exotel.voicebot.device.session.cookie=${DEVICE_SESSION_COOKIE:}

# Tools Server — shares credentials with VoiceBot (same api key / token / account id)
exotel.tools.server.base.url=${TOOLS_SERVER_BASE_URL:https://tools-server-prod.mum1.exotel.com}
exotel.tools.server.api.key=${TOOLS_SERVER_API_KEY:}
exotel.tools.server.api.token=${TOOLS_SERVER_API_TOKEN:}
exotel.tools.server.tenant.id=${TOOLS_SERVER_TENANT_ID:}

# Logging
logging.level.com.example.mcp_api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=./logs/mcp-server.log

# Credential verification limits (MSG-2807). Each live probe to Exotel (a cache miss) costs one token from
# the caller's bucket and one from the global bucket; over either limit the caller gets 429 with Retry-After.
# The caller is the last X-Forwarded-For entry when the TCP peer is private (mcp-alb), else the TCP peer.
exotel.auth.ratelimit.client.capacity=${AUTH_RATELIMIT_CLIENT_CAPACITY:20}
exotel.auth.ratelimit.client.refill-per-minute=${AUTH_RATELIMIT_CLIENT_REFILL_PER_MINUTE:10}
exotel.auth.ratelimit.global.capacity=${AUTH_RATELIMIT_GLOBAL_CAPACITY:100}
exotel.auth.ratelimit.global.refill-per-minute=${AUTH_RATELIMIT_GLOBAL_REFILL_PER_MINUTE:300}
exotel.auth.verify.max-probes-per-request=${AUTH_VERIFY_MAX_PROBES_PER_REQUEST:6}
